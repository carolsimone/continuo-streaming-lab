[project]
name = "continuo-streaming-lab"
version = "0.1.0"
description = "Kafka tiered storage + Iceberg lab"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.6",
    "duckdb>=1.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
